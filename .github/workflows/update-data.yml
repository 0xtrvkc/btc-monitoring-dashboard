name: Update indicator data

on:
  schedule:
    - cron: '17 8 * * *'   # daily 08:17 UTC — CoinTH rebuilds its dataset around 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # data-health issue (opened on problems, closed on recovery)

concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Fetch every indicator from CoinTH and validate
        id: fetch
        run: node scripts/fetch_cointh.mjs
        env:
          HEALTH_OUT: ${{ runner.temp }}/btc-health.json

      - name: Log today's prediction consensus
        if: steps.fetch.outcome == 'success'
        run: node scripts/log_forecast.mjs

      - name: Commit and push if data changed
        run: |
          git add data/
          AS_OF=$(node -e "const d=require('./data/nupl.json');console.log(d.dates.at(-1)+' (NUPL '+d.data.nupl.at(-1)+')')")
          scripts/push_with_retry.sh "chore: update indicator data — ${AS_OF}"

      - name: Data health — open or close the GitHub issue
        if: always()
        run: node scripts/health_issue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          HEALTH_OUT: ${{ runner.temp }}/btc-health.json
